<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>GoShare - Admin Dashboard</title>
<link rel="stylesheet" href="styles.css" />

<!-- NEW: Dark Mode Dynamic Injector -->
<style id="themeStyles">
  body[data-theme="dark"] { background-color: #111827 !important; color: #f9fafb !important; }
  body[data-theme="dark"] .admin-panel { background-color: #1f2937 !important; color: #f9fafb !important; border-color: #374151 !important; }
  body[data-theme="dark"] h2, body[data-theme="dark"] th, body[data-theme="dark"] td { color: #f9fafb !important; border-color:#4b5563 !important; }
  body { padding: 40px; background: #f1f5f9; transition: 0.3s; }
  .admin-panel { max-width: 900px; margin: 0 auto; background: white; padding: 24px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
  .admin-header { display: flex; justify-content: space-between; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 15px; }
  th { padding: 16px; border-bottom: 2px solid var(--border); color: var(--text-muted); text-transform: uppercase; font-size: 13px; }
  td { padding: 16px; border-bottom: 1px solid var(--border); }
  tr:hover td { background: #f8fafc; }
  [data-theme="dark"] tr:hover td { background: #374151 !important; }
</style>
<script>
  function toggleTheme() {
    const body = document.body;
    const isDark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('goshare_theme', isDark ? 'light' : 'dark');
  }
  if(localStorage.getItem('goshare_theme') === 'dark') {
      window.addEventListener('DOMContentLoaded', () => document.body.setAttribute('data-theme', 'dark'));
  }
</script>
</head>
<body>
  <div class="admin-panel">
    
    <!-- NEW: SOS ALERT BOX -->
    <div id="sosAlertBox" style="margin-bottom: 20px;"></div>

    <div class="admin-header">
      <h2>Global Driver Tracking</h2>
      <div>
        <button class="secondary-btn" onclick="toggleTheme()" style="margin-right: 10px;">Toggle Dark Mode 🌙</button>
        <a href="index.html" class="secondary-btn" style="text-decoration:none;">Go Back</a>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th>Driver Name</th>
          <th>Total Trips</th>
          <th>Total Earnings</th>
          <th>Average Rating</th>
        </tr>
      </thead>
      <tbody id="adminTableBody">
      </tbody>
    </table>
  </div>
  <script type="module" src="admin.js"></script>

</body>
</html>
