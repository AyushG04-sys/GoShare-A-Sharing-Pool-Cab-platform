<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GoShare - Driver Dashboard</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="leaflet.css" />
<script src="config.js" defer></script>

<style id="themeStyles">
  body[data-theme="dark"] { background-color: #111827 !important; color: #f9fafb !important; }
  body[data-theme="dark"] .sidebar, body[data-theme="dark"] .driver-card, body[data-theme="dark"] .modal-content, body[data-theme="dark"] .login-card, body[data-theme="dark"] .admin-panel, body[data-theme="dark"] header { background-color: #1f2937 !important; color: #f9fafb !important; border-color: #374151 !important; }
  body[data-theme="dark"] input, body[data-theme="dark"] select { background-color: #374151 !important; color: white !important; border-color: #4b5563 !important; }
  body[data-theme="dark"] .ride-option, body[data-theme="dark"] .suggestion-item { background-color: #374151 !important; }
  body[data-theme="dark"] h2, body[data-theme="dark"] h3, body[data-theme="dark"] h4, body[data-theme="dark"] span { color: #f9fafb !important; }
  body[data-theme="dark"] .text-muted { color: #9ca3af !important; }
  
  body[data-theme="dark"] .leaflet-bar a { background-color: #374151 !important; color: #f9fafb !important; border-color: #4b5563 !important; }
  body[data-theme="dark"] .leaflet-bar a:hover { background-color: #4b5563 !important; }
  body[data-theme="dark"] #locateBtn { background-color: #374151 !important; border-color: #4b5563 !important; box-shadow: 0 4px 6px rgba(0,0,0,0.3) !important; }
  body[data-theme="dark"] #locateMenu { background-color: #374151 !important; box-shadow: 0 4px 15px rgba(0,0,0,0.3) !important; }
  body[data-theme="dark"] #locateMenu button { color: #f9fafb !important; border-bottom-color: #4b5563 !important; }
  body[data-theme="dark"] #locateMenu button:hover { background-color: #4b5563 !important; }
</style>
<script>
  function toggleTheme() {
    const body = document.body;
    const isDark = body.getAttribute('data-theme') === 'dark';
    body.setAttribute('data-theme', isDark ? 'light' : 'dark');
    localStorage.setItem('goshare_theme', isDark ? 'light' : 'dark');
  }
  if(localStorage.getItem('goshare_theme') === 'dark') {
      window.addEventListener('DOMContentLoaded', () => document.body.setAttribute('data-theme', 'dark'));
  }
</script>
</head>
<body>
  <header class="top-header">
    <div class="header-left">
      <div class="logo-small">G</div>
      <h2>GoShare Driver</h2>
    </div>
    <div class="header-right">
      <div class="driver-status">
        <span>Status:</span>
        <label class="switch"><input type="checkbox" id="onlineToggle" /><span class="slider"></span></label>
        <span id="statusText">Offline</span>
      </div>
      <button class="icon-btn" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
      <button class="icon-btn" id="historyBtn">History</button>
      <button class="icon-btn" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="app-main">
    <aside class="sidebar driver-sidebar">
      <div class="driver-card">
        <div class="vehicle-display">
          <div class="vehicle-icon" id="vehicleIcon">🛺</div>
          <div><h3 id="vehicleTitle">Auto Rickshaw</h3><p id="vehicleNumberDisplay">MH 12 AB 1234</p></div>
        </div>
        <div class="earnings-card" style="grid-template-columns: 1fr 1fr 1fr;">
          <div class="earning-item"><span>Earnings</span><strong>₹<span id="todayEarnings">0</span></strong></div>
          <div class="earning-item"><span>Trips</span><strong id="ridesCount">0</strong></div>
          <div class="earning-item"><span>Rating</span><strong><span id="driverRating">5.0</span> <span style="color:#fbbf24;">★</span></strong></div>
        </div>
        <div id="activeRidesContainer"></div>
        <div class="route-section">
          <h4>Your Route</h4>
          <div class="search-input-wrapper"><div class="route-dot pickup"></div><input type="text" id="driverPickup" class="search-input" placeholder="Current location" /></div>
          <div class="search-input-wrapper"><div class="route-dot drop"></div><input type="text" id="driverDrop" class="search-input" placeholder="Destination" /></div>
        </div>
        <div class="matched-passengers" id="matchedPassengers">
          <h4>Passengers on your route</h4><p class="empty-state">Go online to find passengers</p>
        </div>
      </div>
    </aside>

    <section class="map-container">
      <div id="map"></div>
      
      <div class="map-overlay" style="position: absolute; bottom: 30px; right: 20px; z-index: 1000; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
        <div id="locateMenu" class="hidden" style="background: white; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); overflow: hidden; display: flex; flex-direction: column; min-width: 190px;">
          <button id="useGpsBtn" style="padding: 12px 16px; border: none; background: transparent; border-bottom: 1px solid #f3f4f6; cursor: pointer; text-align: left; font-weight: bold; font-size: 14px;">🛰️ Use GPS Location</button>
          <button id="pinPickupBtn" style="padding: 12px 16px; border: none; background: transparent; border-bottom: 1px solid #f3f4f6; cursor: pointer; text-align: left; font-weight: bold; font-size: 14px;">📌 Pin Current Location</button>
          <button id="pinDropBtn" style="padding: 12px 16px; border: none; background: transparent; cursor: pointer; text-align: left; font-weight: bold; font-size: 14px;">📍 Pin Destination</button>
        </div>
        <button id="locateBtn" title="Location Options" style="width: 48px; height: 48px; border-radius: 50%; background: white; border: 2px solid #e5e7eb; font-size: 20px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center;">📍</button>
      </div>
      
    </section>
  </main>

  <div id="requestModal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header"><h3>New Ride Request</h3></div>
      <div class="modal-body">
        <div class="passenger-info">
          <div class="passenger-avatar">👤</div>
          <div><h4 id="passengerName">Passenger</h4><p id="passengerRoute">From → To</p><p class="fare">Estimated fare: ₹<span id="passengerFare">0</span></p></div>
        </div>
        <div class="modal-actions"><button class="secondary-btn" id="rejectBtn">Reject</button><button class="primary-btn" id="acceptBtn">Accept</button></div>
      </div>
    </div>
  </div>

  <div id="historyModal" class="modal hidden">
    <div class="modal-content" style="max-height: 80vh; display: flex; flex-direction: column;">
      <div class="modal-header"><h3>Ride History</h3><button class="close-btn" id="closeHistoryModal">×</button></div>
      <div class="modal-body" style="overflow-y: auto; padding: 20px; text-align: left;"><div id="historyList"></div></div>
    </div>
  </div>

  <div id="locationBanner" class="location-banner">
    <div class="banner-content">
      <span class="banner-icon">📍</span>
      <div class="banner-text"><strong>Where are you driving?</strong><span>Allow GPS to find passengers</span></div>
      <button class="primary-btn banner-btn" id="bannerGrant">Use GPS</button>
      <button class="banner-skip" id="bannerSkip">Skip</button>
    </div>
  </div>

  <script src="store.js" defer></script>
  <script src="geocode.js" defer></script>
  <script src="leaflet.js" defer></script>
  <script src="driver.js" defer></script>
</body>
</html>
