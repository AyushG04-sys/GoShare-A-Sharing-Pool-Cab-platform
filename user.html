<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoShare - Passenger</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; height: 100vh; background-color: #0f172a; color: white; }
        .header { background: #1e293b; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
        .header-left { display: flex; align-items: center; gap: 10px; }
        .header-logo { background: black; color: white; font-weight: bold; padding: 5px 10px; border-radius: 6px; }
        .main-content { display: flex; flex: 1; overflow: hidden; }
        .sidebar { width: 350px; background: #0f172a; padding: 20px; overflow-y: auto; border-right: 1px solid #334155; }
        .map-container { flex: 1; position: relative; }
        #map { width: 100%; height: 100%; }
        .primary-btn { background: #2563eb; color: white; padding: 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 15px; }
        
        .input-group { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .input-group input, .input-group select { background: transparent; border: none; color: white; width: 100%; outline: none; }
        .input-group select option { background-color: #1e293b !important; color: #f8fafc !important; }
        .route-timeline { position: relative; padding-left: 20px; margin-bottom: 25px; }
        .route-timeline::before { content: ''; position: absolute; left: 5px; top: 15px; bottom: 15px; width: 2px; background: #475569; }
        .route-dot-start { position: absolute; left: 0; top: 12px; width: 12px; height: 12px; background: #111827; border-radius: 50%; border: 2px solid #475569; }
        .route-dot-end { position: absolute; left: 0; bottom: 12px; width: 12px; height: 12px; background: #10b981; border-radius: 50%; }

        .hidden { display: none !important; }
        .sos-btn { background: #ef4444; color: white; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; }

        .autocomplete-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1e293b; border: 1px solid #334155; border-radius: 6px; max-height: 200px; overflow-y: auto; z-index: 2000; box-shadow: 0 4px 6px rgba(0,0,0,0.3); margin-top: 4px; }
        .autocomplete-item { padding: 10px; border-bottom: 1px solid #334155; cursor: pointer; color: #cbd5e1; font-size: 13px; text-align: left; line-height: 1.4; }
        .autocomplete-item:hover { background: #334155; color: white; }

        /* Full Screen GPS Modal */
        #gpsModal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.85); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 12px; text-align: center; border: 1px solid #334155; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    </style>
</head>
<body data-theme="dark">

<div id="gpsModal">
    <div class="modal-content">
        <h3 style="margin-top: 0;">Allow Location Access?</h3>
        <p style="color: #94a3b8; font-size: 14px; margin-bottom: 25px;">GoShare needs your location to accurately find nearby rides and drivers.</p>
        <div style="display: flex; gap: 10px;">
            <button id="allowGpsBtn" class="primary-btn" style="margin: 0; background: #10b981;">Allow GPS</button>
            <button id="denyGpsBtn" class="primary-btn" style="margin: 0; background: #475569;">Skip</button>
        </div>
    </div>
</div>

<div class="header">
    <div class="header-left">
        <div class="header-logo">G</div>
        <h2 style="margin: 0; font-size: 20px;">GoShare</h2>
    </div>
    <div style="display: flex; align-items: center; gap: 15px;">
        <span style="color: #94a3b8; font-size: 14px;">Hello, <span id="userNameDisplay" style="color: white; font-weight: bold;">User</span></span>
        <button class="sos-btn" id="sosBtn">SOS</button>
        <button id="logoutBtn" style="background: transparent; border: 1px solid #475569; color: white; padding: 6px 15px; border-radius: 6px; cursor: pointer;">Logout</button>
    </div>
</div>

<div class="main-content">
    <div class="sidebar">
        <div id="bookingPanel">
            <h2 style="color: #f8fafc; margin-bottom: 20px;">Where to?</h2>
            
            <div class="route-timeline">
                <div class="route-dot-start"></div>
                <div class="input-group" style="position: relative; overflow: visible;">
                    <input type="text" id="pickupInput" placeholder="Pickup location" value="Pune, Maharashtra" autocomplete="off">
                    <div id="pickupDropdown" class="autocomplete-dropdown hidden"></div>
                </div>
                
                <div class="route-dot-end"></div>
                <div class="input-group" style="position: relative; overflow: visible;">
                    <input type="text" id="dropInput" placeholder="Search destination..." autocomplete="off">
                    <div id="dropDropdown" class="autocomplete-dropdown hidden"></div>
                </div>
            </div>

            <button id="confirmRouteBtn" class="primary-btn">Confirm Destination</button>

            <div id="vehicleSelectionPanel" class="hidden" style="margin-top: 15px; border-top: 1px solid #334155; padding-top: 15px;">
                <h4 style="color: #cbd5e1; margin-top: 0; margin-bottom: 10px; font-size: 14px;">Available Vehicles & Fares</h4>
                <div class="input-group">
                    <select id="vehicleSelect"></select>
                </div>
                <button id="confirmRideBtn" class="primary-btn" style="background: #10b981;">Confirm & Book Ride</button>
            </div>
        </div>

        <div id="activeRidePanel" class="hidden" style="background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; text-align: center;">
            <h3 style="color: #60a5fa; margin-top: 0;">Ride Status</h3>
            <p id="bookingStatus" style="font-weight: 600; font-size: 18px; margin: 15px 0;">Searching for drivers...</p>
            <p id="sharedStatus" class="hidden" style="font-size: 13px; color: #cbd5e1; background: #334155; padding: 5px; border-radius: 4px;">👥 Shared Cab: 2 Passengers</p>
            <div id="rideOtpDisplay" style="font-size: 24px; font-weight: bold; letter-spacing: 5px; color: #10b981; background: #0f172a; padding: 10px; border-radius: 6px; margin-top: 15px;"></div>
        </div>
    </div>

    <div class="map-container">
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
